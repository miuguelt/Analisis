name: CI - Verificación y Compuerta de Cobertura

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-gate:
    name: Pruebas Automatizadas y Compuerta 100 %
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar compuerta estricta de cobertura (100 % de funciones)
        run: npm run test:coverage

      - name: Compilar distribución de producción
        run: npm run build
